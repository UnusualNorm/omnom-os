on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0,4"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - tag: norman
            modules: base workstation norman
          - tag: normette
            modules: base workstation normette
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: ublue-os/remove-unwanted-software@v9
      - uses: actions/checkout@v7
      - run: sudo podman build
          --build-arg "MODULES=${{ matrix.modules }}"
          --cap-add sys_admin
          --squash-all
          --tag "ghcr.io/unusualnorm/omnom-os:${{ matrix.tag }}"
          .
      - run: sudo podman login
          --username "${{ github.actor }}"
          --password "${{ github.token }}"
          "ghcr.io/unusualnorm"
      - run: sudo podman push
          --compression-format=zstd
          "ghcr.io/unusualnorm/omnom-os:${{ matrix.tag }}"
